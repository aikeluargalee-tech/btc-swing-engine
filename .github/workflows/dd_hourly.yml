name: Tab D Data Hub — Hourly & On-Demand Publisher

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      send_telegram:
        description: 'Deliver Tab D report to Telegram'
        required: false
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: dd-hub-publisher
  cancel-in-progress: false

jobs:
  publish-dd-hub:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Headless Tab D Publisher
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_REPOSITORY_URL: https://github.com/${{ github.repository }}
          DD_DASHBOARD_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.send_telegram }}" = "false" ]; then
            python scripts/publish_dd_hub.py --no-telegram
          else
            python scripts/publish_dd_hub.py --send-telegram
          fi

      - name: Commit and push updated Tab D dashboard & 4H SQLite archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/dd_telemetry_history.sqlite docs/index.html docs/btc_data_hub_latest.md docs/dd_latest.json
          if git diff --cached --quiet; then
            echo "No telemetry or dashboard changes to commit."
            exit 0
          fi
          git commit -m "chore(dd-hub): update Tab D dashboard & 4H telemetry snapshot [skip ci]"
          git pull --rebase --autostash origin main
          git push origin main
